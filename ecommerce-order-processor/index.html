<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecommerce-order-processor </title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen">
    <!-- page header -->
    <header class="bg-blue-600 text-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold">E-Commerce Order Processor</h1>
        </div>

        <!-- main container with spacing between sections -->
        <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
            <!-- orders -->
            <section id="orders" class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Orders</h2>
                <div id="orders-container"></div>
            </section>

            <!-- Search / Filter for inputs and dropdowns  -->
            <section id="search-filter" class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Search / Filter</h2>
                <div id="search-filter-container"></div>
            </section>
            
    </header>

</body>
</html>

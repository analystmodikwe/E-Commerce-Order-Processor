<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ecommerce-order-processor </title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 text-gray-800 min-h-screen">
    <!-- page header -->
    <header class="bg-blue-600 text-white shadow">
        <div class="max-w-6xl mx-auto px-4 py-6">
            <h1 class="text-3xl font-bold">E-Commerce Order Processor</h1>
        </div>
    </header>

    <!-- main container with spacing between sections -->
    <main class="max-w-6xl mx-auto px-4 py-8 space-y-8">
        <!-- orders -->
        <section id="orders" class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Orders</h2>
            <div id="orders-container"></div>
        </section>
        
        <!-- Search / Filter for inputs and dropdowns  -->
        <section id="search-filter" class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Search / Filter</h2>
            <div id="search-filter-container"></div>
        </section>
        
        <!-- Statistics and Categories sit side by side on medium+ screens, stacked on mobile -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        
            <!-- Statistics totals, averages, etc. -->
            <section id="statistics" class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Statistics</h2>
                <div id="statistics-container"></div>
            </section>
        
            <!-- Categories: orders grouped by product category -->
            <section id="categories" class="bg-white rounded-lg shadow p-6">
                <h2 class="text-xl font-semibold mb-4">Categories</h2>
                <div id="categories-container"></div>
            </section>
        </div>

        <!-- Product Lookup fast lookups of product details -->
        <section id="product-lookup" class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Product Lookup</h2>
            <div id="product-lookup-container"></div>
        </section>

        <!-- Data Processing cleaning/transforming the messy order data -->
        <section id="data-processing" class="bg-white rounded-lg shadow p-6">
            <h2 class="text-xl font-semibold mb-4">Data Processing</h2>
            <div id="data-processing-container"></div>
        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
